name: uploader_app
description: "Plantita Flutter uploader app for media management with web-first approach."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.2
  connectivity_plus: ^6.0.3
  retry: ^3.1.2
  jwt_decoder: ^2.0.1
  responsive_framework: ^1.4.0
  flutter_screenutil: ^5.9.3
  universal_html: ^2.2.4
  cached_network_image: ^3.3.1
  form_field_validator: ^1.1.0
  flutter_staggered_animations: ^1.1.1
  flutter_spinkit: ^5.2.1
  url_launcher: ^6.3.0
  share_plus: ^11.1.0
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_performance: ^0.10.0+1
  image: ^4.1.3
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
  integration_test:
    sdk: flutter
  coverage: ^1.7.2
  faker: ^2.1.0
  path: ^1.9.0
  network_image_mock: ^2.1.1
  provider_test: ^2.0.2

flutter:
  uses-material-design: true