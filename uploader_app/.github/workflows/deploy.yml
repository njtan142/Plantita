name: Deploy Plantita Uploader App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  FLUTTER_VERSION: '3.8.1'
  NODE_VERSION: '18'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test --coverage --test-randomize-ordering-seed random

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: flutter
          name: flutter-coverage
          fail_ci_if_error: false

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        environment: [staging, production]
        include:
          - environment: staging
            api-url: 'https://api-staging.plantita.app'
            enable-analytics: 'false'
            enable-crashlytics: 'false'
          - environment: production
            api-url: 'https://api.plantita.app'
            enable-analytics: 'true'
            enable-crashlytics: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter web app
        run: |
          flutter build web \
            --release \
            --dart-define=ENVIRONMENT=${{ matrix.environment }} \
            --dart-define=API_BASE_URL=${{ matrix.api-url }} \
            --dart-define=ENABLE_ANALYTICS=${{ matrix.enable-analytics }} \
            --dart-define=ENABLE_CRASHLYTICS=${{ matrix.enable-crashlytics }} \
            --dart-define=ENABLE_PERFORMANCE_MONITORING=true \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Optimize build
        run: |
          # Copy additional web assets
          cp web/robots.txt build/web/
          cp web/sitemap.xml build/web/
          cp web/offline.html build/web/

          # Minify assets (if tools available)
          echo "Build optimized for ${{ matrix.environment }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: web-build-${{ matrix.environment }}
          path: build/web/
          retention-days: 7

  deploy-firebase:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: build-web
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: web-build-production
          path: build/web/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: |
          firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }} --token ${{ secrets.FIREBASE_TOKEN }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Comment deployment URL
        uses: actions/github-script@v6
        with:
          script: |
            const projectId = '${{ secrets.FIREBASE_PROJECT_ID }}';
            const url = `https://${projectId}.web.app`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 App deployed to Firebase: ${url}`
            });

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-web
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: web-build-production
          path: build/web/

      - name: Setup Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: |
          vercel --yes --token ${{ secrets.VERCEL_TOKEN }} --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: deploy-firebase
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Lighthouse
        run: npm install -g lighthouse

      - name: Run Lighthouse audit
        run: |
          lighthouse https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app \
            --output json \
            --output-path ./lighthouse-report.json \
            --chrome-flags="--headless --disable-gpu --no-sandbox"

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-report
          path: lighthouse-report.json

      - name: Comment Lighthouse scores
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('./lighthouse-report.json', 'utf8'));

            const scores = {
              performance: Math.round(report.categories.performance.score * 100),
              accessibility: Math.round(report.categories.accessibility.score * 100),
              'best-practices': Math.round(report.categories['best-practices'].score * 100),
              seo: Math.round(report.categories.seo.score * 100),
              pwa: Math.round(report.categories.pwa.score * 100)
            };

            const body = `
            📊 **Lighthouse Performance Audit Results**

            | Category | Score |
            |----------|-------|
            | Performance | ${scores.performance}/100 |
            | Accessibility | ${scores.accessibility}/100 |
            | Best Practices | ${scores['best-practices']}/100 |
            | SEO | ${scores.seo}/100 |
            | PWA | ${scores.pwa}/100 |

            Full report: [Download](${context.payload.repository.html_url}/actions/runs/${context.runId}/artifacts)
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security audit
        run: |
          # Run Flutter security checks
          flutter pub deps | grep -E "(http:|git:)" || true

          # Check for common security issues
          echo "🔍 Security scan completed"

  notify:
    name: Notify on Completion
    runs-on: ubuntu-latest
    needs: [deploy-firebase, deploy-vercel, lighthouse-audit]
    if: always()
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        if: always() && env.SLACK_WEBHOOK != ''
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check the logs for details."